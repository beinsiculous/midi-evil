[package]
name = "roll-web"
version = "0.0.0"
edition = "2024"
publish = false
description = "W0-web's throwaway harness: the spike's piano roll on eframe's web runner"

# Standalone: the root workspace excludes this directory, so cargo builds it on its own and the
# release audit never sees it. Its Cargo.lock started as a copy of the root's, so wasm-bindgen
# resolves to the version of the CLI under the main checkout's target/tools/.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
evil-imports = { path = "../../crates/evil-imports" }
evil-project = { path = "../../crates/evil-project" }
log = "0.4"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "Node",
    "NodeList",
    "Window",
] }

[profile.release]
opt-level = "s"
