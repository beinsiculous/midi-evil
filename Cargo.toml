[workspace]
members = [
    "crates/evil-beats",
    "crates/evil-exports",
    "crates/evil-imports",
    "crates/evil-synth",
    "crates/evil-performance",
    "crates/evil-project",
    "crates/evil-render",
    "crates/midi-evil",
]
exclude = ["crates/oracle", "crates/evil-porting"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MIDI Evil contributors"]
license = "MIT"
repository = "https://github.com/beinsiculous/midi-evil"
homepage = "https://github.com/beinsiculous/midi-evil"
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]
