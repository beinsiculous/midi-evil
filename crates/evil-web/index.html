<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An empty icon, so the browser asks the server for nothing but this page and its bundle. -->
<link rel="icon" href="data:,">
<title>MIDI Evil in the browser</title>
<style>
  :root { color-scheme: dark; }
  /* The page never scrolls: Space, the arrows, Home and End belong to the editor. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #131119; color: #eee7d7; font: 16px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 1.1rem; margin: 0; padding: 6px 16px 0; }
  p { margin: 0; padding: 0 16px 6px; }
  button { color: #f9e29f; }
  :focus-visible { outline: 3px solid #f9e29f; outline-offset: -3px; }
  #midi-evil-canvas { display: block; width: 100%; flex: 1 1 auto; min-height: 0; }
  /* Set apart from the canvas by a gap, never a line: a capture of a canvas whose height is
     fractional takes in the next pixel row. */
  #midi-evil-current-section { margin-top: 4px; padding: 0 16px; }
  #midi-evil-current { padding: 0; min-height: 1.5em; max-height: 3em; overflow: hidden; }
  #midi-evil-leave {
    margin: 4px 16px 6px; align-self: flex-start; background: none;
    border: 1px solid #44394f; padding: 2px 10px; font: inherit;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<h1 id="midi-evil-heading" tabindex="-1">MIDI Evil</h1>
<p>A music workstation in the browser. Tab into the editor; what it has focused is written under it.</p>
<span id="midi-evil-enter-first" class="visually-hidden" tabindex="0"></span>
<canvas id="midi-evil-canvas" role="application" aria-label="MIDI Evil editor"
        aria-describedby="midi-evil-current"></canvas>
<section id="midi-evil-current-section" aria-label="Current">
  <p id="midi-evil-current">Loading the editor</p>
</section>
<div id="midi-evil-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<span id="midi-evil-enter-last" class="visually-hidden" tabindex="0"></span>
<button id="midi-evil-leave" type="button">Leave the editor</button>
<script type="module">
  // A module that cannot be fetched or compiled is reported the way the entry reports its own
  // failure to start, rather than left to whichever channel the browser picks for a rejection.
  import init from "./evil_web.js";
  try {
    await init();
  } catch (error) {
    console.error(`MIDI Evil did not start: ${error}`);
  }
</script>
</body>
</html>
